<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Multilab: football fair odds and multis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ecf0ed; --card:#f8faf8; --ink:#13212c; --ink2:#46565f; --ink3:#586871; --rule:#c9d3cd; --grid:rgba(19,33,44,.05);
  --verde:#0f6b33; --verde-bg:#d9eee1; --rosso:#b92f27; --rosso-bg:#f6dcd9; --azzurro:#245fa8; --amber:#8a5d00; --amber-bg:#f3e6c4;
  --seg-h:#245fa8; --seg-d:#586871; --seg-a:#13212c; --seg-t:#fff;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0e181f; --card:#142029; --ink:#e7efeb; --ink2:#a9b8c0; --ink3:#8394a0; --rule:#2a3b46; --grid:rgba(231,239,235,.045);
  --verde:#4fc47f; --verde-bg:#12351f; --rosso:#f0766d; --rosso-bg:#3a1c1a; --azzurro:#78adf0; --amber:#e3b44f; --amber-bg:#372c10;
  --seg-h:#78adf0; --seg-d:#8394a0; --seg-a:#e7efeb; --seg-t:#0e181f;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:400 16px/1.45 var(--body);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;min-height:100vh}
button,select,input{font:inherit;color:inherit}
input[type=range]{accent-color:var(--ink)}
input[type=checkbox]{accent-color:var(--ink)}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:3px solid var(--azzurro);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 14px}

/* chrome */
.tabsbar{position:sticky;top:0;z-index:30;background:var(--paper);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 18px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.brand{display:flex;align-items:baseline;gap:10px}
.wordmark{font:700 30px/1 var(--display);letter-spacing:.01em}
.league{font:600 15px/1 var(--display);padding:3px 7px;border:1.5px solid var(--ink);border-radius:3px}
.fresh{font-size:13px;color:var(--ink3)}
.fresh.old{color:var(--amber);font-weight:600}
.sims{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.seg-btns{display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.seg-btns button{border:0;background:transparent;padding:4px 9px;cursor:pointer;font-weight:600;font-size:13px}
.seg-btns button+button{border-left:1.5px solid var(--ink)}
.seg-btns button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:transparent;padding:10px 11px 8px;cursor:pointer;font:600 20px/1 var(--display);color:var(--ink2);border-bottom:4px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.badge-n[hidden]{display:none}
.badge-n{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:10px;background:var(--ink);color:var(--paper);font:600 13px/1.4 var(--body);text-align:center}

main{padding:16px 0 120px}
.panel[hidden]{display:none}
h2{font:700 30px/1.05 var(--display);margin:6px 0 8px}
h3{font:700 22px/1.1 var(--display);margin:0 0 6px}
h4{font:600 14px/1.2 var(--body);color:var(--ink2);margin:0 0 6px}
.lede{color:var(--ink2);max-width:62ch;margin-bottom:12px}
.small{font-size:13px;color:var(--ink3)}
.how{margin:0 0 6px;font-size:14px;color:var(--ink2)}
.how summary{cursor:pointer;font-weight:600;color:var(--ink)}
.how p{margin-top:6px;max-width:66ch}
.day{font:700 20px/1 var(--display);margin:22px 0 4px;color:var(--ink2)}
.note{border-left:4px solid var(--amber);background:var(--amber-bg);padding:9px 12px;margin:10px 0;font-size:14px;border-radius:0 4px 4px 0}
.note.bad{border-color:var(--rosso);background:var(--rosso-bg)}

/* game card */
.game{background:var(--card);border:1px solid var(--rule);border-radius:6px;margin:12px 0;padding:14px 14px 12px}
.gh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 14px}
.teams{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;font:700 32px/1.05 var(--display)}
.vs{font:500 18px var(--display);color:var(--ink3)}
.when{font-size:14px;color:var(--ink2);font-weight:500}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.badge{font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:3px;border:1.5px solid var(--rule);color:var(--ink2)}
.badge.conf-high{border-color:var(--verde);color:var(--verde)}
.badge.conf-medium{border-color:var(--amber);color:var(--amber)}
.badge.conf-low{border-color:var(--rosso);color:var(--rosso)}
.badge.warn{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.bars{margin:10px 0 2px;display:grid;gap:5px}
.barrow{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:8px}
.bar-l{font-size:13px;font-weight:600;color:var(--ink2)}
.bar{display:flex;height:28px;border-radius:3px;overflow:hidden;border:1px solid var(--rule)}
.seg{display:flex;align-items:center;justify-content:center;font:600 15px/1 var(--display);color:var(--seg-t);min-width:0;overflow:hidden;white-space:nowrap}
.seg.h{background:var(--seg-h)} .seg.d{background:var(--seg-d)} .seg.a{background:var(--seg-a)}
.key{display:flex;flex-wrap:wrap;gap:3px 14px;margin:5px 0 0 80px;font-size:12.5px;color:var(--ink2)}
.key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.xg{margin:8px 0 2px;font-size:14px;color:var(--ink2)}
.xg b{font:700 20px var(--display);color:var(--ink)}
.grp{margin-top:12px}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.tiles.t2{grid-template-columns:repeat(2,1fr)}
.tiles.t4{grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.tiles.t4{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:104px;padding:8px 10px;text-align:left;
  background:var(--paper);border:1.5px solid var(--rule);border-radius:5px;cursor:pointer;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile.ref{cursor:default;border-style:dashed;opacity:.85}
.t-sel{font-size:13px;color:var(--ink2);line-height:1.15;overflow-wrap:anywhere;padding-right:4px}
.t-price{font:700 28px/1 var(--display)}
.t-meta{font-size:12px;color:var(--ink2);line-height:1.25}
.e{font-weight:700}
.e-pos{color:var(--verde)} .e-neg{color:var(--rosso)} .e-flat{color:var(--ink2)}
.tile.edge-pos{background:var(--verde-bg);border-color:var(--verde)}
.tile.on{outline:3px solid var(--ink);outline-offset:1px}
.tile.on::after{content:'In slip';position:absolute;top:6px;right:8px;font-size:11.5px;font-weight:700;color:var(--ink)}
details.more{margin-top:12px;border-top:1px solid var(--rule);padding-top:8px}
details.more>summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
.simbox{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.simout{flex:1 1 280px;font-size:14px;color:var(--ink2)}
.simout b{color:var(--ink)}
.simout table{margin-top:4px}

/* controls */
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:4px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:wait}
.field{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink2)}
.field input,.field select{padding:7px 9px;border:1.5px solid var(--rule);border-radius:4px;background:var(--card);min-width:110px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:10px 0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:14px;margin:12px 0}

/* tables and lists */
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:600;color:var(--ink2);text-align:right;padding:6px 8px;border-bottom:2px solid var(--ink);font-size:13px;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
td b{font-weight:700}
.vgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:820px){.vgrid{grid-template-columns:1fr 1fr}}
.vrow{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:4px 12px;width:100%;text-align:left;padding:9px 6px;background:transparent;border:0;border-bottom:1px solid var(--rule);cursor:pointer}
.vrow.on{background:var(--paper);box-shadow:inset 4px 0 0 var(--ink)}
.v-main b{display:block;font-weight:600}
.v-main small{display:block;font-size:12.5px;color:var(--ink3);line-height:1.25}
.v-num{font:700 20px var(--display);text-align:right;min-width:48px}
.v-num small{display:block;font:500 11.5px var(--body);color:var(--ink3)}
.pill{font:700 17px var(--display);padding:2px 8px;border-radius:3px;border:1.5px solid var(--rule);min-width:56px;text-align:center}
.pill.pos{color:var(--verde);border-color:var(--verde);background:var(--verde-bg)}
.pill.neg{color:var(--rosso);border-color:var(--rosso)}

/* multi */
.legrow{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.legrow .rm{border:1.5px solid var(--rule);background:transparent;border-radius:4px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{border-left:4px solid var(--ink);padding:2px 0 2px 10px}
.stat b{display:block;font:700 30px/1 var(--display)}
.stat span{font-size:13px;color:var(--ink2)}
.stat.pos{border-color:var(--verde)} .stat.neg{border-color:var(--rosso)}
.verdict{font-size:17px;max-width:62ch;margin:6px 0 10px}
.prog{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;margin:8px 0}
.prog>i{display:block;height:100%;width:0;background:var(--ink)}
.range{width:100%}
.slide{margin:10px 0;display:grid;gap:2px}
.slide label{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.slide small{color:var(--ink3);font-size:12.5px}

/* slip chip */
.slipchip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;border:2px solid var(--ink);background:var(--ink);color:var(--paper);
  padding:11px 20px;border-radius:30px;font:600 17px var(--display);letter-spacing:.01em;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.slipchip[hidden]{display:none}
.slipchip.bump{animation:bump .25s}
@keyframes bump{50%{transform:translateX(-50%) scale(1.07)}}
.foot{max-width:980px;margin:0 auto;padding:0 14px 90px;font-size:12.5px;color:var(--ink3)}
.loading{padding:60px 0;text-align:center;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:560px){.hide-s{display:none}}
@media (max-width:430px){.tabs button{padding:10px 8px 8px;font-size:18px}.wordmark{font-size:27px}}
@media (max-width:430px){th,td{padding-left:5px;padding-right:5px}}

.t-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:5px}
.tag{font-style:normal;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;line-height:1.5}
.tag.lk{background:var(--ink);color:var(--paper)}
.tag.vl{background:var(--verde);color:var(--paper)}
.glance{margin:12px 0 4px;border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.g-row{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:stretch;padding:7px 8px;border-top:1px solid var(--rule)}
.g-row:first-child{border-top:0;background:var(--paper);font-size:12.5px;font-weight:600;color:var(--ink2)}
.g-m{font-size:13px;font-weight:600;color:var(--ink2);align-self:center}
.gbtn{display:block;width:100%;text-align:left;border:1.5px solid var(--rule);background:var(--paper);border-radius:4px;padding:5px 7px;cursor:pointer}
.gbtn b{display:block;font-weight:600;font-size:14px;line-height:1.2}
.gbtn small{display:block;font-size:12px;color:var(--ink2);line-height:1.25}
.gbtn.lk{border-color:var(--ink)}
.gbtn.vl{border-color:var(--verde);background:var(--verde-bg)}
.gbtn.on{outline:3px solid var(--ink);outline-offset:1px}
.none{font-size:12.5px;color:var(--ink3);align-self:center;line-height:1.3}
.simout tr.sec th{text-align:left;padding-top:12px;color:var(--ink);font-size:14px;border-bottom:1px solid var(--rule)}

.tile.edge-warn{border-color:var(--amber);background:var(--amber-bg)}
.e-warn{color:var(--amber)}
.pill.warn{color:var(--amber);border-color:var(--amber);background:var(--amber-bg)}

.lchips{display:flex;flex-wrap:wrap;gap:6px}
.lchip{font:600 15px/1 var(--display);padding:5px 9px;border:1.5px solid var(--ink);border-radius:3px;background:transparent;color:var(--ink);cursor:pointer}
.lchip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.lchip[disabled]{cursor:default}
.lbar{margin:2px 0 10px}
.lg-badge{border-color:var(--ink);color:var(--ink)}

</style>
</head>
<body>
<header class="top-outer">
  <div class="wrap top">
      <div class="brand"><span class="wordmark">Multilab</span><div class="lchips" id="lchips" role="group" aria-label="Leagues shown"></div></div>
      <div class="fresh" id="fresh" aria-live="polite">Loading data</div>
      <div class="sims" role="group" aria-label="Simulations per run">
        <span>Simulations per run</span>
        <div class="seg-btns" id="simbtns">
          <button type="button" data-sims="10000">10k</button><button type="button" data-sims="20000">20k</button><button type="button" data-sims="50000">50k</button><button type="button" data-sims="100000">100k</button>
        </div>
      </div>
  </div>
</header>
<div class="tabsbar"><div class="wrap">
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button type="button" role="tab" data-tab="games">Games</button>
      <button type="button" role="tab" data-tab="value">Value</button>
      <button type="button" role="tab" data-tab="multi">Multi<span class="badge-n" id="slipn" hidden>0</span></button>
      <button type="button" role="tab" data-tab="season">Season</button>
      <button type="button" role="tab" data-tab="model">Model</button>
    </nav>
</div></div>
<main class="wrap">
  <div id="status"></div>
  <section class="panel" id="p-games" role="tabpanel" hidden></section>
  <section class="panel" id="p-value" role="tabpanel" hidden></section>
  <section class="panel" id="p-multi" role="tabpanel" hidden></section>
  <section class="panel" id="p-season" role="tabpanel" hidden></section>
  <section class="panel" id="p-model" role="tabpanel" hidden></section>
</main>
<button type="button" class="slipchip" id="slipchip" hidden></button>
<p class="foot">Multilab turns past results into estimated chances. They are estimates, not tips, and Sportsbet's prices already include their margin. Bet small and only what you can afford to lose. If it stops being fun, Gambling Help Online is on 1800 858 858.</p>

<script>
// ==== ENGINE START
const E = (function () {
  'use strict';
  const DAY = 86400000, G = 11, CELLS = 121;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  // ---------- team names (odds sites spell clubs differently) ----------
  const FILLER = new Set(['ac', 'acf', 'as', 'ss', 'ssc', 'us', 'fc', 'cfc', 'bc', 'afc', 'sc', 'cf', 'calcio', 'club', 'football']);
  const ALIAS = { 'inter milan': 'inter', 'internazionale': 'inter', 'fc internazionale milano': 'inter', 'internazionale milano': 'inter' };
  const tokens = s => (String(s).toLowerCase().match(/[a-z]+|\d+/g) || []).filter(w => !FILLER.has(w) && !/^\d+$/.test(w));
  const canon = s => { const k = String(s).trim().toLowerCase(); return ALIAS[k] || k; };
  function nameScore(a, b) {
    a = canon(a); b = canon(b);
    if (a === b) return 4;
    const ta = tokens(a), tb = tokens(b);
    if (!ta.length || !tb.length) return 0;
    if (ta.join(' ') === tb.join(' ')) return 3;
    const sa = new Set(ta), sb = new Set(tb);
    const inter = ta.filter(x => sb.has(x)).length;
    if (inter && (ta.every(x => sb.has(x)) || tb.every(x => sa.has(x)))) return 1 + 0.5 * inter / Math.max(ta.length, tb.length);
    return 0;
  }
  function sideScore(name, game, side) {
    let s = nameScore(name, game[side]);
    const api = game[side + '_api'];
    if (api) s = Math.max(s, nameScore(name, api));
    return s;
  }
  function resolveOne(name, game) {
    const h = sideScore(name, game, 'home'), a = sideScore(name, game, 'away');
    if (h === a) return null;
    return h > a ? 'home' : 'away';
  }
  function resolveTwo(n1, n2, game) {
    const s1 = sideScore(n1, game, 'home') + sideScore(n2, game, 'away');
    const s2 = sideScore(n1, game, 'away') + sideScore(n2, game, 'home');
    if (s1 === s2) return null;
    return s1 > s2 ? ['home', 'away'] : ['away', 'home'];
  }

  // ---------- score grid (Poisson with the Dixon-Coles low-score fix) ----------
  function pmf(l, n) { const p = new Float64Array(n + 1); p[0] = Math.exp(-l); for (let k = 1; k <= n; k++) p[k] = p[k - 1] * l / k; return p; }
  function tau(i, j, lh, la, rho) {
    if (i === 0 && j === 0) return 1 - lh * la * rho;
    if (i === 0 && j === 1) return 1 + lh * rho;
    if (i === 1 && j === 0) return 1 + la * rho;
    if (i === 1 && j === 1) return 1 - rho;
    return 1;
  }
  function scoreGrid(lh, la, rho, d) {
    const ph = pmf(lh, G - 1), pa = pmf(la, G - 1), g = new Float64Array(CELLS), dd = d == null ? 1 : d;   // dd lifts every drawn scoreline
    let s = 0;
    for (let i = 0; i < G; i++) for (let j = 0; j < G; j++) {
      const v = ph[i] * pa[j] * Math.max(tau(i, j, lh, la, rho), 0) * (i === j ? dd : 1);
      g[i * G + j] = v; s += v;
    }
    for (let k = 0; k < CELLS; k++) g[k] /= s;
    return g;
  }
  const mask = pred => { const m = new Uint8Array(CELLS); for (let i = 0; i < G; i++) for (let j = 0; j < G; j++) if (pred(i, j)) m[i * G + j] = 1; return m; };
  const dot = (m, grid) => { let s = 0; for (let k = 0; k < CELLS; k++) if (m[k]) s += grid[k]; return s; };

  // ---------- data ----------
  function parseDate(d) {
    if (typeof d === 'number') return d;
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || ''));
    return m ? Date.UTC(+m[1], +m[2] - 1, +m[3], 12) : null;
  }
  const nn = v => (v === undefined || v === null ? null : v);
  function prepRows(sets) {
    const rows = [];
    for (const set of sets) for (const m of (set.matches || [])) {
      const date = parseDate(m.date);
      if (date == null || m.hg == null || m.ag == null) continue;
      rows.push({ date, season: set.season, home: m.home, away: m.away, hg: m.hg, ag: m.ag,
        hs: nn(m.hs), as: nn(m['as']), hst: nn(m.hst), ast: nn(m.ast), odds: m.closing_odds || null });
    }
    rows.sort((a, b) => a.date - b.date);
    return rows;
  }

  // shots -> expected goals stand-in. Centred regression: goals vary with shots on target and other shots
  // around their averages, so the proxy keeps the real average goals and only uses what shots tell us.
  function fitShots(rows) {
    let n = 0, sg = 0, ss = 0, so = 0, sss = 0, soo = 0, sso = 0, sgs = 0, sgo = 0;
    const add = (g, hst, hs) => {

      if (sm.bets >= 10) {
        const bands = [[0.025, 0.10, '3% to 10%'], [0.10, 0.25, '10% to 25%'], [0.25, 99, '25% or more']].map(b => { const L = r.bets.filter(x => x.edge >= b[0] && x.edge < b[1]); return { name: b[2], n: L.length, won: L.filter(x => x.won).length, exp: L.reduce((t, x) => t + x.p, 0), roi: L.length ? L.reduce((t, x) => t + x.profit, 0) / L.length : 0 }; }).filter(b => b.n);
        h += '<h3 style="margin-top:16px">Does a bigger edge mean a better bet?</h3><div class="scroll"><table><thead><tr><th>Value</th><th>Bets</th><th>Won</th><th>Expected</th><th>Return</th></tr></thead><tbody>' +
          bands.map(b => '<tr><td>' + b.name + '</td><td>' + b.n + '</td><td>' + b.won + '</td><td>' + b.exp.toFixed(1) + '</td><td>' + sgn(b.roi) + '</td></tr>').join('') + '</tbody></table></div>' +
          '<p class="small">If the edges were real, the bigger bands would pay better. If they are noise, they will not.</p>';
      }
    }
    h += '<h3 style="margin-top:16px">Likeliest result</h3><p>The model\u2019s likeliest result was right in <b>' + fmtN(sm.likelyRight) + ' of ' + fmtN(sm.matches) + '</b> matches. The market favourite was right in <b>' + fmtN(sm.favRight) + ' of ' + fmtN(sm.matches) + '</b>.</p>';
    h += '<h3 style="margin-top:16px">Goals check</h3><p>The model expected <b>' + sm.avgExpGoals.toFixed(2) + '</b> goals a game. There were <b>' + sm.avgGoals.toFixed(2) + '</b>.' +
      (sm.avgGoals - sm.avgExpGoals > 0.15 ? ' The model has been running low, which flatters Under 2.5 bets.' : sm.avgExpGoals - sm.avgGoals > 0.15 ? ' The model has been running high, which flatters Over 2.5 bets.' : ' That is close.') + '</p>';
    if (r.cal.length >= 90) {
      const rows = E.calibration(r.cal);
      h += '<h3 style="margin-top:16px">When the model says X%, how often does it happen?</h3><div class="scroll"><table><thead><tr><th>Model said</th><th>Results</th><th>Model</th><th>Market</th><th>Actual</th></tr></thead><tbody>' +
        rows.map(c => '<tr><td>' + pct(c.lo) + ' to ' + pct(c.hi) + '</td><td>' + fmtN(c.n) + '</td><td>' + pct(c.model, 1) + '</td><td>' + pct(c.market, 1) + '</td><td><b>' + pct(c.actual, 1) + '</b></td></tr>').join('') + '</tbody></table></div>' +
        '<p class="small">Model and Market are the average chance each gave; Actual is how often it happened. Look at the low rows: if Model sits above Actual, the model is too kind to outsiders. The Market column shows how the bookmakers did on the same results.</p>';
    }
    const ms = r.rounds.filter(x => x.multi);
    if (ms.length) {
      const landed = ms.filter(x => x.multi.won).length, expected = ms.reduce((t, x) => t + x.multi.modelP, 0);
      h += '<h3 style="margin-top:16px">The suggested multi</h3><p>The balanced pick for each round (best-value leg from different games, 45% or more likely, top four) landed in <b>' + landed + ' of ' + ms.length + '</b> rounds. The model expected about ' + expected.toFixed(1) + '.</p>';
      const cards = ms.map(x => { const m = x.multi; return '<div class="card" style="margin:8px 0"><p><b>' + dShort(x.start) + (x.end !== x.start ? ' to ' + dShort(x.end) : '') + ':</b> ' + (m.won ? '<b class="e e-pos">Landed</b>' : '<span class="e e-neg">Missed</span>') + ' at ' + m.price.toFixed(2) + 'x (the model gave it ' + pct(m.modelP) + ')</p>' +
        m.legs.map(l => '<div class="small">' + (l.won ? 'Won' : 'Lost') + ': ' + esc(l.sel) + ', ' + esc(l.match) + ', ' + price(l.price) + '</div>').join('') + '</div>'; }).join('');
      h += ms.length > 4 ? '<details class="how"><summary>Round by round</summary>' + cards + '</details>' : cards;
    }
    h += r.bets.length > 25 ? '<details class="how" style="margin-top:12px"><summary>All ' + fmtN(r.bets.length) + ' bets</summary>' + betsTable(r.bets, st) + '</details>' : (r.bets.length ? '<h3 style="margin-top:16px">The bets</h3>' + betsTable(r.bets, st) : '');
    h += '<details class="how" style="margin-top:12px"><summary>Every match in the period</summary><div class="scroll"><table><thead><tr><th>Match</th><th>Score</th><th>Model\u2019s pick</th><th>Market favourite</th></tr></thead><tbody>' +
      r.matches.map(m => '<tr><td>' + esc(m.label) + (m.low ? ' <span class="small">(low confidence)</span>' : '') + '</td><td>' + m.hg + '-' + m.ag + '</td><td>' + tick(m.likelyRight) + '</td><td>' + tick(m.favRight) + '</td></tr>').join('') + '</tbody></table></div></details>' +
      '<p class="small" style="margin-top:8px">Closing odds already include late team news, so they are a tough yardstick. The real Sportsbet prices a few days out will have been a little different, and their margin is a little bigger.</p>';
    return h;
  }
  function btHtml() {
    const b = S.backtest; if (!b) return '';
    if (b === 'none') return '<p>Not enough matches with closing odds to score yet.</p>';
    const d = b.llModel - b.llMarket;
    return '<p style="margin-top:10px"><b>' + b.n + ' matches.</b> Model <b>' + b.llModel.toFixed(3) + '</b>, market <b>' + b.llMarket.toFixed(3) + '</b> (log loss on the result). ' +
      (d <= 0.002 ? 'The model is keeping up with the market, which is hard to do.' : d < 0.03 ? 'The market is slightly sharper, which is normal.' : 'The market is clearly sharper so far, so be careful about trusting big edges.') +
      ' The model scored better than the market on ' + pct(b.betterShare) + ' of games.</p><p class="small">The market sees injuries and lineups. The model does not, yet. With only a few matchdays this is a rough guide.</p>';
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-leg],[data-act],[data-tab],[data-sims],[data-rm],[data-league],[data-cur]'); if (!t) return;
    if (t.dataset.leg) return toggleLeg(t.dataset.leg);
    if (t.dataset.rm) return toggleLeg(t.dataset.rm);
    if (t.dataset.league) return toggleLeague(t.dataset.league);
    if (t.dataset.cur) return pickLeague(t.dataset.cur);
    if (t.dataset.tab) return showTab(t.dataset.tab);
    if (t.dataset.sims) { S.sims = Number(t.dataset.sims); store.set('sims', S.sims); updateSimBtns(); S.dirty = new Set(TABS); S.dirty.delete(S.tab); S.simOut = ''; S.yearsOut = ''; showTabRefresh(); return; }
    switch (t.dataset.act) {
      case 'sim-game': return simGame(t.dataset.gid);
      case 'vmore': S.vf.limit += 30; return renderVTable();
      case 'sim-slip': return simSlip();
      case 'replay': return replay();
      case 'clear': S.slip = []; store.set('slip', S.slip); S.simOut = ''; S.yearsOut = ''; $$('[data-leg]').forEach(n => { n.classList.remove('on'); n.setAttribute('aria-pressed', 'false'); }); S.dirty.add('multi'); updateSlipUI(false); return renderMulti();
      case 'suggest': { const picks = E.suggestSlip(visibleLegs(), S.sug.k, S.sug.min);
        if (!picks.length) { S.simOut = ''; S.yearsOut = ''; return alert('Nothing fits that style right now. Try Balanced or Spicy.'); }
        S.slip = picks.map(l => l.key); store.set('slip', S.slip); S.simOut = ''; S.yearsOut = ''; S.simPay = null; S.dirty.add('multi'); S.dirty.add('games'); S.dirty.add('value'); updateSlipUI(true); return renderMulti(); }
      case 'season': return runSeason();
      case 'paper': { t.disabled = true; t.textContent = 'Running'; return setTimeout(() => { const pc = ptConfig(); S.pt.res = E.paperTrade(S.rows, fitOpts(false), pc.seasons, { rounds: pc.rounds, minEdge: S.pt.min, trust: S.set.trust / 100, skipLow: S.pt.skipLow }) || 'none'; $('#pt').innerHTML = ptHtml(); t.disabled = false; t.textContent = 'Run it again'; }, 30); }
      case 'backtest': { t.disabled = true; t.textContent = 'Running'; return setTimeout(() => { S.backtest = E.backtest(S.rows, fitOpts(false), 'cur') || 'none'; $('#bt').innerHTML = btHtml(); t.disabled = false; t.textContent = 'Run the scorecard again'; }, 30); }
    }
  });
  function showTabRefresh() { const t = S.tab; S.dirty.add(t); showTab(t); }
  document.addEventListener('change', e => {
    const id = e.target.id;
    if (id === 'vf-market') { S.vf.market = e.target.value; S.vf.limit = 30; renderVTable(); }
    else if (id === 'vf-min') { S.vf.min = Number(e.target.value); S.vf.limit = 30; renderVTable(); }
    else if (id === 'vf-low') { S.vf.low = e.target.checked; S.vf.limit = 30; renderVTable(); }
    else if (id === 'vf-cap') { S.vf.cap = e.target.checked; S.vf.limit = 30; renderVTable(); }
    else if (id === 'vf-long') { S.vf.long = e.target.checked; S.vf.limit = 30; renderVTable(); }
    else if (id === 'pt-rounds') S.pt.scope = e.target.value;
    else if (id === 'pt-min') S.pt.min = Number(e.target.value);
    else if (id === 'pt-low') S.pt.skipLow = e.target.checked;
    else if (id === 'sg-k') S.sug.k = Number(e.target.value);
    else if (id === 'sg-min') S.sug.min = Number(e.target.value);
    else if (id === 'stake') { S.stake = e.target.value; store.set('stake', S.stake); }
    else if (id === 'quoted') { S.quoted = e.target.value; S.simOut = ''; S.yearsOut = ''; S.simPay = null; renderMulti(); }
    else if (id === 's-hl' || id === 's-rg' || id === 's-sb' || id === 's-tr') {
      S.set = { halfLife: Number($('#s-hl').value), ridge: Number($('#s-rg').value), shotBlend: Number($('#s-sb').value), trust: Number($('#s-tr').value) }; store.set('set3', S.set);
      refit(); showTabRefresh();
    } else if (id === 'pickfiles') loadFiles(e.target.files);
  });
  document.addEventListener('input', e => { const id = e.target.id; if (id === 's-hl' || id === 's-rg' || id === 's-sb' || id === 's-tr') $('#' + id + '-v').textContent = e.target.value; });
  $('#slipchip').addEventListener('click', () => showTab('multi'));
  async function loadFiles(files) {
    const sel = $('#pickleague'), lid = sel ? sel.value : LEAGUES[0].id, raw = { results: null, odds: null, history: null, meta: null };
    for (const f of Array.from(files)) {
      try { const j = JSON.parse(await f.text()), n = f.name.toLowerCase(); if (n.indexOf('result') >= 0) raw.results = j; else if (n.indexOf('odds') >= 0) raw.odds = j; else if (n.indexOf('hist') >= 0) raw.history = j; else if (n.indexOf('meta') >= 0) raw.meta = j; } catch (err) { showError(f.name + ' is not valid JSON'); return; }
    }
    if (raw.results && raw.odds) {
      const info = LEAGUES.find(l => l.id === lid) || { id: lid, name: lid };
      S.lg[lid] = { id: lid, name: info.name, raw, rows: [], model: null, unpriced: 0 };
      if (S.order.indexOf(lid) < 0) S.order.push(lid);
      start();
    }
  }
  window.__multilab = { S, E };   // handy for debugging in the browser console
  boot();
})();

</script>
</body>
</html>
