name: Check bookmaker markets

on:
  workflow_dispatch:   # manual only: adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check which bookmakers return which markets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/check_bookmakers.py

      - name: Save report to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Bookmaker check $(date -u +'%Y-%m-%d %H:%M')"
          git push
