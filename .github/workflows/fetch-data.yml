name: Fetch football data

on:
  schedule:
    # Times are UTC. 22:30 UTC Mon/Thu = 9:00am Tue/Fri in Adelaide (daylight time).
    - cron: "30 22 * * 1"   # Tuesday: results + standard odds (about 2 credits a league)
    - cron: "30 22 * * 4"   # Friday: also fetches extra markets (BTTS, double chance...)
  workflow_dispatch:         # "Run workflow" button in the Actions tab
    inputs:
      extras:
        description: "Also fetch extra markets (BTTS, double chance, etc). Uses more credits."
        type: boolean
        default: true
      leagues:
        description: "Which leagues to fetch. Only applies to a manual run; the Tuesday and Friday runs fetch every enabled league."
        type: choice
        options:
          - all
          - serie-a
          - premier-league
        default: all

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch results and odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SEASON_CODE: "2627"
          FETCH_EXTRAS: "${{ github.event.schedule == '30 22 * * 4' || inputs.extras == true }}"
          HISTORY_SEASONS: "5"
          LEAGUES: "${{ inputs.leagues || 'all' }}"
        run: python scripts/fetch_data.py

      - name: Save data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M')"
          git push
